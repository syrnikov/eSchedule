<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#dcebff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
  <title>Пари</title>

  <!-- Home screen install -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Пари">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Icon font: self-hosted Material Symbols subset. The icon list is in scripts/icons.mjs. -->
  <link rel="preload" href="fonts/material-symbols-rounded.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main class="app">
    <div class="view" id="main-view">
      <header class="top">
        <!-- Avatar → profile; gear → app settings; chart → stats (labels set in main.js) -->
        <div class="top-bar">
          <a class="avatar-btn" id="avatar-btn" href="#profile"></a>
          <div class="top-actions">
            <a class="glyph-btn" id="settings-btn" href="#settings">
              <span class="icon" aria-hidden="true">settings</span>
            </a>
            <a class="glyph-btn" id="stats-btn" href="#stats">
              <span class="icon" aria-hidden="true">insert_chart</span>
            </a>
          </div>
        </div>
        <div class="hello">
          <p class="date" id="date"></p>
          <p class="greeting" id="greeting"></p>
          <p class="day-summary" id="day-summary"></p>
        </div>
      </header>

      <h1 class="sr-only" id="app-heading"></h1>
      <p class="sr-only" id="announcer" aria-live="polite"></p>
      <section class="card hero" id="hero"></section>
      <section class="card" id="today" hidden></section>
      <section class="card stats-card" id="stats" hidden></section>
      <section class="card card--compact" id="deadlines" hidden></section>
      <section class="card push-card" id="push-card" hidden></section>
      <section class="card card--compact" id="tomorrow" hidden></section>

      <footer class="foot" id="footer"></footer>
    </div>

    <div class="view" id="tasks-view" hidden></div>
    <div class="view" id="teachers-view" hidden></div>
    <div class="view" id="settings-view" hidden></div>
    <div class="view" id="profile-view" hidden></div>
    <div class="view" id="stats-view" hidden></div>
    <div class="view" id="days-view" hidden></div>
    <div class="view" id="join-view" hidden></div>
    <div class="view" id="onboarding-view" hidden></div>
  </main>

  <!-- Пари · Завдання · Викладачі (js/tabbar.js fills it in) -->
  <nav class="tabbar" id="tabbar" hidden></nav>

  <dialog class="news" id="news" aria-labelledby="news-title"></dialog>
</body>
</html>
